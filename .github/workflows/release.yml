name: Release
run-name: ${{ inputs.dry-run && 'Dry run' || 'Release' }} by @${{ github.actor }}

# Publishes every public workspace whose version is not on npm yet, through npm
# trusted publishing (GitHub OIDC, with provenance): there is no npm token.
# Versions are bumped by hand in a PR first; see "Releasing" in the README.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only pack and show what would be published'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # Builds and packs with no publishing rights: whatever the install or the
  # build runs never sees the OIDC token.
  prepare:
    name: Pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the previous tag of each package, for the compare link
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false # nothing another workflow cached goes into a release

      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint, build and test
        run: yarn lint && yarn build && yarn test

      # Fails on a version that has no section in its package's CHANGELOG.md.
      - name: Pack unpublished versions
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          echo '## Packed' >> "$GITHUB_STEP_SUMMARY"
          yarn workspaces foreach -A --no-private --topological exec node "$PWD/tools/release/pack.mjs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

      # Dry run only, after the upload so that the artifact stays as packed:
      # the scripts of the Publish job in plan mode, on the same files. They make
      # the same reads (npm view, gh release view, gh api) and print the writes
      # instead of making them. The token here can only read anyway.
      - name: Plan the publish job
        if: inputs.dry-run
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$GITHUB_WORKSPACE/tools/release/publish.mjs" --plan
          node "$GITHUB_WORKSPACE/tools/release/summary.mjs" --plan

  # Publishes the tarballs packed above. Nothing is installed here, and nothing
  # from the artifact is executed: the artifact comes out of a job that ran
  # `yarn install`, so it is data only. The two scripts that do the work come
  # from git, a sparse checkout of tools/release at the commit Pack built, and
  # use Node builtins only. The artifact goes to a directory of its own, so that
  # none of its files can land on top of the scripts. If the job fails halfway,
  # use "Re-run failed jobs": what is already on npm or on GitHub is skipped.
  publish:
    name: Publish
    needs: prepare
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write # GitHub releases and their tags
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tools/release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }} # the commit Pack built, even if main has moved since
          sparse-checkout: tools/release
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24 # npm >= 11.5.1 for trusted publishing

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release
          path: ${{ runner.temp }}/release

      # In manifest order, which is the dependency order: npm publish unless the
      # version is on npm, then a GitHub release unless there is one.
      - name: Publish to npm and create GitHub releases
        working-directory: ${{ runner.temp }}/release
        run: |
          npm --version
          node "$GITHUB_WORKSPACE/tools/release/publish.mjs"

      # Last, so that if it fails the packages are out already and the summary
      # release can be made by hand.
      - name: Create the summary release
        working-directory: ${{ runner.temp }}/release
        run: node "$GITHUB_WORKSPACE/tools/release/summary.mjs"
