name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

  workflow_dispatch:

jobs:

  main:
    name: Default
    runs-on: ubuntu-latest
    permissions:
      contents: write # the website deploy pushes to gh-pages
      pull-requests: write # the failure comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      # Coverage is enforced by each package's own thresholds, so a drop fails
      # here rather than on a dashboard nobody opens.
      - name: Test
        id: test
        run: yarn test:coverage
        continue-on-error: true

      # Replaces the old allure + surge.sh publication: the reporter in
      # tools/reporter writes a standalone page, so an artifact is enough.
      - name: Upload test report
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: packages/morphology/test-report.html

      # `gh` rather than an action: the one that used to do this is still on
      # Node 20 in its latest release, and editing the last comment gives the
      # same "do not pile up a comment per run" behaviour.
      - name: Link the report in the PR
        if: github.event_name == 'pull_request' && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment '${{ github.event.pull_request.number }}' \
            --edit-last --create-if-none \
            --body 'Tests failed — download the `test-report` artifact from [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'

      - name: Abort if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Deploy to GH pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
